<!-- Sidebar Navigation — visible on desktop (>=1024px), hidden on mobile via CSS -->
<aside class="sidebar">
    <!-- Logo -->
    <div class="sidebar-logo">
        <h1><span class="logo-mark"><i class="fas fa-graduation-cap"></i></span>TuitionPe</h1>
        <p>Tuition Management</p>
    </div>

    <!-- Nav Links -->
    <nav class="sidebar-nav">
        <div class="nav-section">Menu</div>
        <a href="{{ url_for('dashboard.dashboard') }}"
           class="{{ 'active' if request.endpoint == 'dashboard.dashboard' else '' }}">
            <i class="fas fa-th-large"></i>
            <span>Dashboard</span>
        </a>
        <a href="{{ url_for('students.student_list') }}"
           class="{{ 'active' if 'students' in request.endpoint else '' }}">
            <i class="fas fa-user-graduate"></i>
            <span>Students</span>
        </a>
        <a href="{{ url_for('schedule.schedule') }}"
           class="{{ 'active' if request.endpoint == 'schedule.schedule' else '' }}">
            <i class="fas fa-calendar-alt"></i>
            <span>Schedule</span>
        </a>
        <a href="{{ url_for('schedule.attendance_tracker') }}"
           class="{{ 'active' if request.endpoint == 'schedule.attendance_tracker' else '' }}">
            <i class="fas fa-clipboard-check"></i>
            <span>Attendance</span>
        </a>
        <a href="{{ url_for('fees.fees') }}"
           class="{{ 'active' if 'fees' in request.endpoint else '' }}">
            <i class="fas fa-rupee-sign"></i>
            <span>Fees</span>
        </a>
        <div class="nav-section">Account</div>
        <a href="{{ url_for('profile.profile') }}"
           class="{{ 'active' if 'profile' in request.endpoint else '' }}">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Profile Card at bottom -->
    <div class="sidebar-profile">
        <a href="{{ url_for('profile.profile') }}" class="profile-card">
            <div class="profile-avatar">
                {% if current_user.profile_image %}
                <img src="{{ current_user.profile_image | img_url }}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">
                {% else %}
                {{ current_user.name[0]|upper }}
                {% endif %}
            </div>
            <div class="profile-info">
                <div class="profile-name">{{ current_user.name }}</div>
                <div class="profile-sub">{{ current_user.subjects.split(',')[0] if current_user.subjects else 'Tutor' }}</div>
            </div>
        </a>
    </div>
</aside>
