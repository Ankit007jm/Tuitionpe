<!-- Parent-facing top navigation -->
<header class="sticky top-0 z-40 border-b" style="background:color-mix(in srgb, var(--bg-card) 92%, transparent); backdrop-filter: blur(16px); border-color: var(--border-default);">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="{{ url_for('parents.find_teachers') }}" class="flex items-center gap-2 font-extrabold text-lg" data-no-fade>
            <span class="w-8 h-8 rounded-lg icon-chip gradient-accent"><i class="fas fa-graduation-cap text-xs"></i></span>
            TuitionPe
        </a>
        <nav class="flex items-center gap-1.5 text-sm font-semibold">
            <a href="{{ url_for('parents.find_teachers') }}" class="px-3 py-2 rounded-lg transition-colors {{ 'text-accent' if request.endpoint == 'parents.find_teachers' else 'text-gray-500 hover:text-accent' }}">
                <i class="fas fa-search mr-1"></i><span class="hidden sm:inline">Find Teachers</span>
            </a>
            {% if parent %}
            <a href="{{ url_for('parents.parent_home') }}" class="px-3 py-2 rounded-lg transition-colors {{ 'text-accent' if request.endpoint == 'parents.parent_home' else 'text-gray-500 hover:text-accent' }}">
                <i class="fas fa-inbox mr-1"></i><span class="hidden sm:inline">My Requests</span>
            </a>
            <a href="{{ url_for('parents.parent_logout') }}" class="px-3 py-2 rounded-lg text-gray-500 hover:text-accent transition-colors" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </a>
            {% else %}
            <a href="{{ url_for('parents.parent_login') }}" class="px-3 py-2 rounded-lg text-gray-500 hover:text-accent transition-colors">Log in</a>
            <a href="{{ url_for('parents.parent_signup') }}" class="btn-primary px-4 py-2 rounded-xl text-sm">Sign up</a>
            {% endif %}
        </nav>
    </div>
</header>
